name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/srdatalog/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/srdatalog/**'
  workflow_dispatch:

# Single concurrent deploy — later pushes cancel earlier in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
          enable-cache: true

      - name: Install docs deps
        run: |
          # uv installs the local project editable, so autodoc2 can import
          # srdatalog without publishing documentation tools as package extras.
          uv sync --frozen --no-default-groups --group docs

      - name: Build HTML
        run: |
          uv run --frozen --no-default-groups --group docs \
            sphinx-build -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Deploy on every build that targets main — covers both push and
    # manual workflow_dispatch runs. PRs skip (they build only to
    # validate; they don't have the pages: write permission anyway).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
